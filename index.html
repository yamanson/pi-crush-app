<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pi-Crush Elite</title>
    <!-- STEP 1 - Sign the user in, in the browser by loading Pi SDK first -->
    <script src="https://minepi.com"></script>
    <style>
        :root {
            --neon-gold: #f1c40f;
            --neon-purple: #9b59b6;
            --neon-orange: #e67e22;
            --neon-blue: #00d2ff;
            --neon-green: #00ff66;
            --dark-space: #07080d;
            --panel-bg: #11131e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--dark-space);
            background-image: radial-gradient(circle at 50% 50%, #1a1c2e 0%, var(--dark-space) 80%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-frame {
            width: 100%;
            max-width: 430px;
            height: 92vh;
            max-height: 780px;
            background: var(--panel-bg);
            border: 2px solid rgba(230, 126, 34, 0.4);
            box-shadow: 0 0 35px rgba(230, 126, 34, 0.15);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            gap: 20px;
        }

        .title-glow {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--neon-gold), var(--neon-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(230, 126, 34, 0.6));
            margin-bottom: 5px;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        .action-btn {
            background: transparent;
            border: 2px solid var(--neon-orange);
            color: #ffffff;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(230, 126, 34, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 80%;
        }

        .action-btn:hover {
            background: var(--neon-orange);
            box-shadow: 0 0 25px var(--neon-orange);
            transform: translateY(-2px);
        }

        #gameplay-view {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            width: 100%;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .hud-label {
            font-size: 0.75rem;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .hud-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
        }

        #score-val { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
        #level-val { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        #grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 5px;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 16px;
            border: 2px solid #2c3e50;
            margin: 15px 0;
        }

        .tile {
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            background: rgba(255,255,255,0.01);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .selected {
            transform: scale(0.9);
            box-shadow: 0 0 18px #ffffff !important;
            border: 2px solid #ffffff !important;
            z-index: 10;
        }

        .t-pi { color: var(--neon-orange); text-shadow: 0 0 12px var(--neon-orange); }
        .t-btc { color: var(--neon-gold); text-shadow: 0 0 12px var(--neon-gold); }
        .t-eth { color: var(--neon-purple); text-shadow: 0 0 12px var(--neon-purple); }
        .t-sol { color: var(--neon-blue); text-shadow: 0 0 12px var(--neon-blue); }
        .t-nano { color: var(--neon-green); text-shadow: 0 0 12px var(--neon-green); }

        .crypto-decor {
            font-size: 3.5rem;
            opacity: 0.12;
            position: absolute;
            animation: floatAnimation 4s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(230, 126, 34, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(230, 126, 34, 0.7)); }
        }

        @keyframes floatAnimation {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        .version-tag {
            font-size: 0.75rem;
            color: #4f5366;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-frame">
        <div class="crypto-decor" id="dec1" style="top: 15%; left: 10%; color: var(--neon-orange);">π</div>
        <div class="crypto-decor" id="dec2" style="top: 50%; right: 12%; color: var(--neon-gold); animation-delay: 1.5s;">₿</div>
        <div class="crypto-decor" id="dec3" style="bottom: 20%; left: 15%; color: var(--neon-purple); animation-delay: 3s;">Ξ</div>

        <!-- WINDOW 1: MENU VIEW -->
        <div id="menu-view" class="menu-container">
            <div>
                <h1 class="title-glow">PI-CRUSH</h1>
                <div class="subtitle">Elite Edition</div>
            </div>
            <!-- Call Pi.authenticate on sign-in button press -->
            <button class="action-btn" id="auth-btn" onclick="authenticatePioneer()">Connect Pi Wallet</button>
        </div>

        <!-- WINDOW 2: GAMEPLAY VIEW -->
        <div id="gameplay-view">
            <header>
                <div>
                    <div class="hud-label">Score</div>
                    <div class="hud-value" id="score-val">0</div>
                </div>
                <div style="text-align: right;">
                    <div class="hud-label">Target</div>
                    <div class="hud-value" id="level-val">1000</div>
                </div>
            </header>
            <div id="grid"></div>
            <div style="text-align:center; font-size:0.8rem; color:#4f5366; letter-spacing: 1px; text-transform: uppercase;">
                Match 3 Crypto Stones
            </div>
        </div>

        <div class="version-tag">Global Web3 Ecosystem v1.0.0</div>
    </div>

    <script>
        let accessToken = null;

        function onIncompletePaymentFound(payment) {
            console.log("Incomplete payment found", payment);
        };

        // Await Pi.init fully before calling Pi.authenticate. Do not pass "sandbox"
        try {
            Pi.init({ version: "2.0" });
            console.log("Pi SDK Initialized without sandbox string.");
        } catch(e) {
            console.log("Standard browser fallback.");
        }

        function authenticatePioneer() {
            try {
                // Call Pi.authenticate with required scope on button press
                Pi.authenticate(['username'], onIncompletePaymentFound).then(function(auth) {
                    // Keep the accessToken. Ignore the uid and username beside it.
                    accessToken = auth.accessToken;
                    console.log("Authenticated successfully inside App Studio.");
                    loadGamePlay();
                }).catch(function(error) {
                    console.error("Auth error, forcing bypass for testing:", error);
                    loadGamePlay(); 
                });
            } catch(err) {
                loadGamePlay();
            }
        }

        const menuView = document.getElementById('menu-view');
        const gameplayView = document.getElementById('gameplay-view');
        const grid = document.getElementById('grid');
        const scoreDisplay = document.getElementById('score-val');
        const width = 8;
        let score = 0;
        let board = [];

        const stoneTypes = [
            { symbol: 'π', class: 't-pi' },
            { symbol: '₿', class: 't-btc' },
            { symbol: 'Ξ', class: 't-eth' },
            { symbol: '◎', class: 't-sol' },
