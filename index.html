<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pi-Crush Elite</title>
    <!-- Pi Network Resmi SDK bağlantısı -->
    <script src="https://minepi.com"></script>
    <style>
        :root {
            --neon-gold: #f1c40f;
            --neon-purple: #9b59b6;
            --neon-orange: #e67e22;
            --dark-space: #07080d;
            --panel-bg: #11131e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--dark-space);
            background-image: radial-gradient(circle at 50% 50%, #1a1c2e 0%, var(--dark-space) 80%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-frame {
            width: 100%;
            max-width: 430px;
            height: 92vh;
            max-height: 780px;
            background: var(--panel-bg);
            border: 2px solid rgba(230, 126, 34, 0.4);
            box-shadow: 0 0 35px rgba(230, 126, 34, 0.15);
            border-radius: 24px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            gap: 20px;
        }

        .title-glow {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--neon-gold), var(--neon-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(230, 126, 34, 0.6));
            margin-bottom: 5px;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        .action-btn {
            background: transparent;
            border: 2px solid var(--neon-orange);
            color: #ffffff;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(230, 126, 34, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 80%;
        }

        .action-btn:hover {
            background: var(--neon-orange);
            box-shadow: 0 0 25px var(--neon-orange);
            transform: translateY(-2px);
        }

        .action-btn:active {
            transform: translateY(1px);
        }

        .crypto-decor {
            font-size: 3.5rem;
            opacity: 0.15;
            position: absolute;
            animation: floatAnimation 4s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(230, 126, 34, 0.5)); }
            50% { filter: drop-shadow(0 0 25px rgba(230, 126, 34, 0.8)); }
        }

        @keyframes floatAnimation {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        .version-tag {
            font-size: 0.75rem;
            color: #4f5366;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-frame">
        <!-- Arka Plan Kripto Süslemeleri -->
        <div class="crypto-decor" style="top: 15%; left: 10%; color: var(--neon-orange);">π</div>
        <div class="crypto-decor" style="top: 50%; right: 12%; color: var(--neon-gold); animation-delay: 1.5s;">₿</div>
        <div class="crypto-decor" style="bottom: 20%; left: 15%; color: var(--neon-purple); animation-delay: 3s;">Ξ</div>

        <!-- ANA GİRİŞ PENCERESİ -->
        <div id="menu-view" class="menu-container">
            <div>
                <h1 class="title-glow">PI-CRUSH</h1>
                <div class="subtitle">Elite Edition</div>
            </div>
            
            <button class="action-btn" onclick="loadGamePlay()">Madenciliği Başlat</button>
        </div>

        <div class="version-tag">Global Web3 Ecosystem v1.0.0</div>
    </div>

    <script>
        // Pi SDK Erken Hazırlık Bağlantısı
        try {
            Pi.init({ version: "2.0", sandbox: true });
            console.log("Pi Ecosystem Ready.");
        } catch(e) {
            console.log("Local browser testing mode.");
        }

        // 2. Ekrana geçiş fonksiyon altyapısı
        function loadGamePlay() {
            alert("Harika! Giriş penceresi onaylandı. Şimdi 2. Ekran olan 'Oyun Alanı ve Taş Mekanikleri' kodlarını birleştirmeye hazırız.");
        }
    </script>
</body>
</html>
